name: Build and deploy

on:
  schedule:
    # NHTSA публикует помесячно; собираем 12-го числа в 04:20 UTC.
    # Cron у GitHub «best effort», задержка 5–60 минут не важна.
    - cron: "20 4 12 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "data/generations.clean.json"
      - ".github/workflows/build.yml"

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Зависимостей нет по решению D-009 — только стандартная библиотека.
      - name: Fetch NHTSA data
        run: python pipeline/fetch_nhtsa.py

      - name: Build database
        run: python pipeline/build_db.py

      - name: Coverage report
        run: python pipeline/coverage_check.py

      - name: Render site
        run: python pipeline/render.py

      - name: Sanity check
        run: |
          COUNT=$(find dist -name index.html | wc -l)
          echo "страниц собрано: $COUNT"
          # Защита от тихой поломки: если корпус внезапно усох, не публикуем.
          if [ "$COUNT" -lt 200 ]; then
            echo "::error::Слишком мало страниц ($COUNT) — публикация остановлена"
            exit 1
          fi
          # Языковой шлюз. 2026-08-12: русский текст утёк на все 321 страницу,
          # структурные проверки этого не увидели. Урок — read-the-rendered-output.
          CYR=$(grep -rlP '[\x{0400}-\x{04FF}]' dist | wc -l)
          if [ "$CYR" -gt 0 ]; then
            echo "::error::Кириллица найдена на $CYR страницах — сайт англоязычный, публикация остановлена"
            grep -rlP '[\x{0400}-\x{04FF}]' dist | head -5
            exit 1
          fi
          echo "языковая проверка пройдена"
          # Шлюз на управляющие символы. Данные ODI читаются как latin-1, а писались
          # в чём-то ещё: 0x19 доехал до цитат владельцев как «I\x19ve owned».
          CTL=$(grep -rlP '[\x00-\x08\x0B\x0C\x0E-\x1F]' dist | wc -l)
          if [ "$CTL" -gt 0 ]; then
            echo "::error::Управляющие символы на $CTL страницах — публикация остановлена"
            grep -rlP '[\x00-\x08\x0B\x0C\x0E-\x1F]' dist | head -5
            exit 1
          fi
          # Каждый адрес должен отдавать своё. Одинаковый размер у главной и у страницы
          # поколения означает включённый catch-all — 2026-08-12 так и было.
          for f in dist/404.html dist/contact/index.html dist/toyota/index.html; do
            [ -s "$f" ] || { echo "::error::нет файла $f"; exit 1; }
          done
          echo "проверка целостности пройдена"

      # Wrangler не создаёт проект сам и падает с «Project not found».
      # Шаг идемпотентный: если проект уже есть, команда падает — это ожидаемо и игнорируется.
      # Держим создание здесь, а не в дашборде, чтобы инфраструктура воспроизводилась из репозитория.
      - name: Ensure Pages project exists
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create mileagecurve --production-branch=main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mileagecurve --branch=main

  # Отдельная задача-«сторож»: GitHub молча отключает cron после 60 дней
  # без активности в репозитории. Ежемесячный коммит этого не допускает.
  keepalive:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "mileagecurve-bot"
          git config user.email "hello@mileagecurve.com"
          git add .keepalive
          git diff --staged --quiet || git commit -m "chore: keepalive"
          git push
